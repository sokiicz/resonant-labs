name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Only files listed here are published. A new root file or folder
      # (another page, 404.html, .well-known) must be added to this list.
      - name: Assemble site files
        run: |
          mkdir _site
          cp index.html apps.html blog.html blog-post.html app-detail.html privacy.html \
             CNAME robots.txt sitemap.xml favicon.svg _site/
          cp -r css fonts js Media apps blog _site/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
