name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject secrets into chatbot.js
        run: |
          sed -i "s|__WEB3FORMS_KEY__|${{ secrets.WEB3FORMS_KEY }}|g" js/chatbot.js
          sed -i "s|__ADMIN_SCRIPT_URL__|${{ secrets.ADMIN_SCRIPT_URL }}|g" js/chatbot.js

      - name: Assemble site files
        run: |
          mkdir _site
          cp index.html apps.html blog.html blog-post.html app-detail.html privacy.html \
             CNAME robots.txt sitemap.xml favicon.svg _site/
          cp -r css js Media apps blog _site/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
